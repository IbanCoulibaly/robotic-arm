<svg viewBox="0 0 920 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="sm-arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="680" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Facial Expression State Machine</text>
  <text x="460" y="48" text-anchor="middle" font-size="13" fill="#64748b">determineExpression(buttons, isSpeaking) — evaluated every control-loop tick</text>

  <!-- connecting lines first, so circles sit on top -->
  <line x1="450" y1="270" x2="450" y2="205" stroke="#334155" stroke-width="2" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"/>
  <text x="465" y="238" font-size="12" fill="#334155">Triangle</text>

  <line x1="450" y1="410" x2="450" y2="475" stroke="#334155" stroke-width="2" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"/>
  <text x="465" y="447" font-size="12" fill="#334155">Square</text>

  <line x1="380" y1="340" x2="245" y2="340" stroke="#334155" stroke-width="2" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"/>
  <text x="258" y="328" font-size="12" fill="#334155">Circle</text>

  <line x1="520" y1="340" x2="655" y2="340" stroke="#334155" stroke-width="2" marker-start="url(#sm-arrow)" marker-end="url(#sm-arrow)"/>
  <text x="565" y="328" font-size="12" fill="#334155">Cross</text>

  <line x1="505" y1="390" x2="635" y2="518" stroke="#b45309" stroke-width="2" stroke-dasharray="7,5" marker-start="url(#sm-arrow-dashed)" marker-end="url(#sm-arrow-dashed)"/>

  <!-- states -->
  <circle cx="450" cy="340" r="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="450" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Neutral</text>
  <text x="450" y="353" text-anchor="middle" font-size="10.5" fill="#1e3a8a">default / idle</text>

  <circle cx="450" cy="140" r="65" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="450" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Happy</text>
  <text x="450" y="153" text-anchor="middle" font-size="10.5" fill="#065f46">Triangle held</text>

  <circle cx="450" cy="540" r="65" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="536" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Sad</text>
  <text x="450" y="553" text-anchor="middle" font-size="10.5" fill="#1e40af">Square held</text>

  <circle cx="180" cy="340" r="65" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="180" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Angry</text>
  <text x="180" y="353" text-anchor="middle" font-size="10.5" fill="#991b1b">Circle held</text>

  <circle cx="720" cy="340" r="65" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="720" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Surprised</text>
  <text x="720" y="353" text-anchor="middle" font-size="10.5" fill="#854d0e">Cross held</text>

  <!-- speaking override -->
  <rect x="620" y="505" width="260" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="750" y="533" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Speaking</text>
  <text x="750" y="551" text-anchor="middle" font-size="10.5" fill="#92400e">mouth animates with TTS audio</text>
  <text x="750" y="565" text-anchor="middle" font-size="10.5" fill="#92400e">(highest priority, any state)</text>

  <text x="460" y="645" text-anchor="middle" font-size="12" fill="#64748b">Priority on every tick: isSpeaking → Speaking, else first true button (△ Happy, ▢ Sad, ○ Angry, ✕ Surprised), else Neutral.</text>
</svg>
