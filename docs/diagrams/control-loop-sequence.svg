<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">One Control-Loop Tick (loop(), ~50 Hz)</text>
  <text x="380" y="45" text-anchor="middle" font-size="13" fill="#64748b">Sequence from a controller input to the five arm servos</text>

  <!-- lifeline headers -->
  <rect x="30" y="64" width="160" height="34" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="110" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">PS4 Controller</text>

  <rect x="300" y="64" width="160" height="34" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="380" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">ESP32 loop()</text>

  <rect x="570" y="64" width="160" height="34" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="650" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">PCA9685</text>

  <!-- lifelines -->
  <line x1="110" y1="98" x2="110" y2="280" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="380" y1="98" x2="380" y2="280" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="650" y1="98" x2="650" y2="280" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 1: controller report -->
  <text x="245" y="118" text-anchor="middle" font-size="11.5" fill="#334155">Bluetooth HID report: both sticks + R2 (~50&#160;Hz)</text>
  <line x1="110" y1="128" x2="380" y2="128" stroke="#334155" stroke-width="2" marker-end="url(#seq-arrow)"/>

  <!-- self-call: normalize + map -->
  <path d="M380,150 C470,150 470,195 380,195" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="482" y="162" font-size="11.5" font-weight="600" fill="#1e3a8a">1. normalizeStickAxis() ×4,</text>
  <text x="482" y="177" font-size="11.5" fill="#1e3a8a">   normalizeTriggerAxis()</text>
  <text x="482" y="192" font-size="11.5" fill="#1e3a8a">2. stickToJointAngle() ×4,</text>
  <text x="482" y="207" font-size="11.5" fill="#1e3a8a">   triggerToJointAngle() → pulse ×5</text>

  <!-- 2: drive servos -->
  <text x="515" y="223" text-anchor="middle" font-size="11.5" fill="#334155">setPWM(channel, 0, pulse) ×5 — I2C @ GPIO 21/22</text>
  <line x1="380" y1="233" x2="650" y2="233" stroke="#334155" stroke-width="2" marker-end="url(#seq-arrow)"/>

  <!-- loop note -->
  <rect x="200" y="255" width="360" height="46" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="283" text-anchor="middle" font-size="12.5" fill="#78350f">delay(20&#160;ms) → loop() repeats (~50&#160;Hz control rate)</text>
</svg>
