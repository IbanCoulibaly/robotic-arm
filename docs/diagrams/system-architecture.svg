<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <text x="380" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Robotic Arm — System Architecture</text>
  <text x="380" y="48" text-anchor="middle" font-size="13" fill="#64748b">Finished build: PS4 controller → ESP32 → PCA9685 → 5-servo arm. Nothing else is wired up.</text>

  <!-- PS4 controller -->
  <rect x="250" y="80" width="260" height="64" rx="10" fill="#eef2ff" stroke="#334155" stroke-width="2"/>
  <text x="380" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">PS4 DualShock Controller</text>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#475569">Left/right sticks (X/Y) + R2 trigger</text>

  <!-- ESP32 -->
  <rect x="210" y="200" width="340" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="380" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">ESP32 DevKit</text>
  <text x="380" y="250" text-anchor="middle" font-size="12" fill="#1e3a8a">Reads controller input, maps each axis to a</text>
  <text x="380" y="266" text-anchor="middle" font-size="12" fill="#1e3a8a">clamped joint angle, drives the servo driver</text>

  <line x1="380" y1="144" x2="380" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="176" font-size="11" fill="#475569" font-style="italic">Bluetooth</text>

  <!-- PCA9685 -->
  <rect x="170" y="320" width="420" height="66" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="380" y="347" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">PCA9685 → 5-Servo Arm</text>
  <text x="380" y="365" text-anchor="middle" font-size="11" fill="#065f46">Base · Shoulder · Elbow · Wrist (20kg, ch 0–3) · Gripper (9g, ch 4)</text>

  <line x1="380" y1="286" x2="380" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="306" font-size="11" fill="#475569" font-style="italic">I2C (GPIO 21/22) — setPWM ×5</text>
</svg>
